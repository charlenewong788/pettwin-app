<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PetPersona · Understand your furry friend</title>
  <meta name="description" content="PetPersona - an MBTI-style pet personality test. An owner observation quiz plus at-home mini experiments (like the treat-cup test) generate a shareable persona card for your cat or dog." />
  <meta name="theme-color" content="#f7eedd" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="22" fill="var(--accent)" />
          <ellipse cx="16.5" cy="16" rx="4.2" ry="5.4" fill="#fff" transform="rotate(-18 16.5 16)" />
          <ellipse cx="31.5" cy="16" rx="4.2" ry="5.4" fill="#fff" transform="rotate(18 31.5 16)" />
          <ellipse cx="10.5" cy="25" rx="3.4" ry="4.4" fill="#fff" transform="rotate(-38 10.5 25)" />
          <ellipse cx="37.5" cy="25" rx="3.4" ry="4.4" fill="#fff" transform="rotate(38 37.5 25)" />
          <path d="M24 22c5 0 9.5 3.8 9.5 8.3 0 3.4-2.8 5.7-6.1 5.7-1.3 0-2.4-.4-3.4-1-1 .6-2.1 1-3.4 1-3.3 0-6.1-2.3-6.1-5.7C14.5 25.8 19 22 24 22z" fill="#fff" />
        </svg>
        <span class="brand-name" data-t="app.name"></span>
      </div>
      <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language"></button>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav id="tabbar" aria-label="Main">
      <button class="tab" data-route="home" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1v-8.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span data-t="nav.home"></span>
      </button>
      <button class="tab" data-route="assess" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7.2" r="2.1" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="15" cy="7.2" r="2.1" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="5.6" cy="11.4" r="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="18.4" cy="11.4" r="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 11.2c2.9 0 5.4 2.2 5.4 4.8 0 2-1.6 3.3-3.5 3.3-.7 0-1.3-.2-1.9-.6-.6.4-1.2.6-1.9.6-1.9 0-3.5-1.3-3.5-3.3 0-2.6 2.5-4.8 5.4-4.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span data-t="nav.assess"></span>
      </button>
      <button class="tab" data-route="discover" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z" fill="currentColor"/></svg>
        <span data-t="nav.discover"></span>
      </button>
      <button class="tab" data-route="records" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20S3.5 14.5 3.5 8.8C3.5 6 5.6 4 8.2 4c1.7 0 3 .9 3.8 2.2C12.8 4.9 14 4 15.8 4c2.6 0 4.7 2 4.7 4.8C20.5 14.5 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span data-t="nav.records"></span>
      </button>
      <button class="tab" data-route="me" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.2" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.8 20.2c.9-3.4 3.8-5.4 7.2-5.4s6.3 2 7.2 5.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span data-t="nav.me"></span>
      </button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/data-types.js"></script>
  <script src="js/data-questions.js"></script>
  <script src="js/data-experiments.js"></script>
  <script src="js/data-fun.js"></script>
  <script src="js/data-content.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/card.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* Retire the old PetTwin service worker, if any. */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
